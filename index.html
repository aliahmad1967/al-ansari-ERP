<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA meta tags -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Offline-first enterprise resource planning system" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AL-ANSARI ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AL-ANSARI ERP" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="apple-touch-icon" href="/assets/icon-192.svg" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>AL-ANSARI ERP</title>
    <script>
      ;(function () {
        try {
          var theme = window.localStorage.getItem('al-ansari:theme')
          if (
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark')
          }
          var lang = window.localStorage.getItem('al-ansari:language')
          if (lang === 'en') {
            document.documentElement.lang = 'en'
            document.documentElement.dir = 'ltr'
          } else {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          }
        } catch (error) {
          /* storage unavailable — defaults apply */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
